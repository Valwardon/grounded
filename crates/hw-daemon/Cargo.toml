[package]
name = "hw-daemon"
version = "0.1.0"
edition = "2024"
description = "Android ForegroundService bridge — lock-free channels, sensor ingestion, lifecycle, render bridge"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
cognitive-core = { path = "../cognitive-core" }
episodic-memory = { path = "../episodic-memory" }
metacognition = { path = "../metacognition" }
planning-core = { path = "../planning-core" }
semantic-graph = { path = "../semantic-graph" }
wgpu = { version = "22", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
default = []
wgpu = ["dep:wgpu"]
