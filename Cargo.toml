[workspace]
resolver = "2"
members = [
    "crates/semantic-graph",
    "crates/semantic-parser",
    "crates/cognitive-core",
    "crates/hw-daemon",
    "crates/curiosity-core",
    "crates/asset-ingestor",
    "crates/uniffi-exports",
    "crates/metacognition",
    "crates/episodic-memory",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
